services:
  backend:
    build: ./backend
    environment:
      DAY_AHEAD_CUTOFF: ${DAY_AHEAD_CUTOFF:-15:30}
      CACHE_SECONDS: ${CACHE_SECONDS:-900}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
